# The presubmit suite (cloister docs/grange.md R3): the "verify" check
# the main ruleset requires.  Zero secrets by policy (R6) — the forge
# lint audits Actions secrets to empty.
name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # The module is stdlib-only by policy (docs/STDLIB_PORT_PLAN.md):
      # if tidy wants to add a require, a third-party import crept in.
      - name: Verify stdlib-only
        run: |
          go mod tidy
          git diff --exit-code go.mod
          test ! -f go.sum

      - name: Build
        run: go build ./...

      - name: Test
        run: go test ./...

      - name: Vet
        run: go vet ./...

      # The forge's own merge-path protections (cloister docs/grange.md
      # R1-R8), asserted against this repo's pinned expectations.  The
      # workflow token cannot read collaborator roles or Actions secrets,
      # so those report UNVERIFIED (-allow-unverified downgrades them to
      # warnings); the operator runs the same lint with an admin token
      # for the full verdict.  Any readable rule that drifts still fails
      # the PR.
      - name: Forge lint (merge-path protections)
        env:
          FORGE_LINT_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: go run github.com/jeffbstewart/cloister/cmd/forge-lint@main -config .github/forge-lint.yaml -allow-unverified

  image:
    # Build the scratch image and push it to
    # ghcr.io/jeffbstewart/powerwall_prometheus_exporter on pushes to
    # main and version tags -- only after verify passes.  Uses the
    # built-in GITHUB_TOKEN (no stored secret, so R6 zero-secrets
    # holds; same rationale as keaexporter/ddnscheck).  The package
    # inherits the public repo's visibility.  Consumer: the homenet
    # k8s cell runs this exporter (SHA-pinned pull), replacing the
    # NAS-local registry build.
    needs: [verify]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
